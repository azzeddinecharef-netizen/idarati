<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDARATI CRM</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="idarati-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f1c; --surface:#111827; --surface-2:#161f33; --surface-3:#1c2740; --hover:#24304d;
    --border:rgba(148,163,184,.10); --border-strong:rgba(148,163,184,.18);
    --text:#e6ebf5; --muted:#8a97b0; --faint:#5d6a85;
    --accent:#3b82f6; --accent-hover:#2563eb; --accent-soft:rgba(59,130,246,.12); --accent-text:#93c5fd;
    --c-new:#3b82f6; --c-contacted:#06b6d4; --c-callback:#f59e0b; --c-meeting:#a78bfa; --c-signed:#22c55e; --c-lost:#64748b; --c-noanswer:#f472b6;
    --danger:#f87171; --danger-soft:rgba(248,113,113,.12); --warn:#fbbf24; --warn-soft:rgba(245,158,11,.12);
    --wa:#25d366; --wa-soft:rgba(37,211,102,.1);
    --shadow:0 6px 18px rgba(0,0,0,.25); --scrim:rgba(3,7,18,.55);
    --radius:14px; --ease:cubic-bezier(.2,.7,.2,1);
    color-scheme:dark;
  }
  [data-theme="light"]{
    --bg:#e4e6ea; --surface:#f0f1f3; --surface-2:#eaecef; --surface-3:#dde0e5; --hover:#d3d7dd;
    --border:#d4d8de; --border-strong:#c4c9d1;
    --text:#14181e; --muted:#414955; --faint:#6a727e;
    --accent:#3b66c4; --accent-hover:#3158ad; --accent-soft:#dfe5f0; --accent-text:#2a4f9c;
    --c-new:#4a78cc; --c-contacted:#3592a3; --c-callback:#c48628; --c-meeting:#8268c4; --c-signed:#40935e; --c-lost:#7c8592; --c-noanswer:#c2507f;
    --danger:#bf3f3a; --danger-soft:#f0dfdf; --warn:#94600f; --warn-soft:#efe4cf;
    --wa:#2f8a54; --wa-soft:#dcebe1;
    --shadow:0 4px 14px rgba(20,24,30,.07); --scrim:rgba(20,24,30,.22);
    color-scheme:light;
  }
  [data-theme="light"] body{font-weight:500}
  [data-theme="light"] .kpi-ico{filter:saturate(.8)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .3s var(--ease),color .3s var(--ease)}
  [dir="ltr"] body{font-family:'Inter',system-ui,sans-serif;font-size:13.5px}
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select,textarea{font-family:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  svg.i.sm{width:15px;height:15px}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}
  .ltr{direction:ltr;unicode-bidi:isolate}

  /* ---------- Layout ---------- */
  .app{display:grid;grid-template-columns:250px 1fr;height:100vh}
  aside{background:var(--surface);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px;gap:4px;overflow-y:auto;transition:background .3s}
  main{display:flex;flex-direction:column;min-width:0;height:100vh}

  /* ---------- Sidebar ---------- */
  .brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
  .logo{width:38px;height:38px;border-radius:10px;object-fit:contain;flex-shrink:0;display:block}
  .brand b{display:block;font-size:15px}
  .brand span{font-size:12px;color:var(--muted)}
  .nav-label{font-size:11px;color:var(--faint);padding:14px 8px 4px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--muted);font-weight:500;transition:background .2s var(--ease),color .2s var(--ease);width:100%;text-align:start}
  .nav-item:hover{background:var(--surface-3);color:var(--text)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent-text)}
  .nav-item .count{margin-inline-start:auto;font-size:11px;background:var(--surface-3);padding:1px 7px;border-radius:20px;color:var(--muted)}
  .nav-item .count.warn{background:var(--warn-soft);color:var(--warn)}
  .admin-toggle{white-space:nowrap;display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:9px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-weight:700;font-size:13px;color:var(--text);transition:background .2s,border-color .2s;gap:8px;min-width:0}
  .admin-toggle:hover{background:var(--surface-3)}
  .admin-toggle span[data-t]{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .admin-toggle .lock{font-size:10px;padding:1px 6px;border-radius:20px;background:var(--warn-soft);color:var(--warn);font-weight:700}
  .admin-toggle .chev{margin-inline-start:auto;transition:transform .3s var(--ease);color:var(--muted);flex-shrink:0}
  .admin-toggle[aria-expanded="true"]{border-color:var(--border-strong);border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent}
  .admin-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .admin-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
  .admin-panel.open{grid-template-rows:1fr}
  .admin-panel > div{overflow:hidden}
  .admin-box{border:1px solid var(--border-strong);border-top:0;border-radius:0 0 12px 12px;padding:4px;background:var(--surface-2);opacity:0;transform:translateY(-4px);transition:opacity .25s var(--ease),transform .25s var(--ease)}
  .admin-panel.open .admin-box{opacity:1;transform:none}
  .admin-box .nav-item{color:var(--text)}
  .aside-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:2px}
  .switch{margin-inline-start:auto;width:30px;height:17px;border-radius:20px;background:var(--surface-3);position:relative;transition:background .25s}
  .switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:13px;height:13px;border-radius:50%;background:var(--muted);transition:inset-inline-start .25s var(--ease),background .25s}
  .switch.on{background:var(--accent)}
  .switch.on::after{inset-inline-start:15px;background:#fff}
  .lang-tag{margin-inline-start:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--surface-3)}

  /* ---------- Header + filters ---------- */
  header{display:flex;align-items:center;gap:12px;padding:16px 24px 12px}
  header h1{font-size:18px;font-weight:800}
  header p{font-size:12px;color:var(--muted)}
  .btn-primary{margin-inline-start:auto;display:flex;align-items:center;gap:6px;background:var(--accent);color:#fff;padding:9px 14px;border-radius:10px;font-weight:700;font-size:13px;transition:transform .15s var(--ease),background .2s}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-primary:active{transform:scale(.97)}
  .filters{display:flex;align-items:center;gap:8px;padding:0 24px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .search{position:relative;flex:1;min-width:200px;max-width:320px}
  .search input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;padding-inline-start:34px;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
  .search svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
  .ctl{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:13px;outline:none;cursor:pointer;transition:border-color .2s,box-shadow .2s}
  .search input:focus,.ctl:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .ctl.active{border-color:var(--accent);color:var(--accent-text)}
  .date-range{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 8px;font-size:12px;color:var(--muted)}
  .date-range input{border:0;background:transparent;padding:7px 2px;font-size:13px;outline:none;color:var(--text);cursor:pointer}
  .reset{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);padding:7px 10px;border-radius:9px;transition:background .2s,color .2s;opacity:0;pointer-events:none}
  .reset.show{opacity:1;pointer-events:auto}
  .reset:hover{background:var(--surface-3);color:var(--text)}
  .result-count{font-size:12px;color:var(--faint);margin-inline-start:auto}

  .presets{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px}
  .presets button{font-size:12.5px;padding:5px 10px;border-radius:7px;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap}
  .presets button:hover{color:var(--text)}
  .presets button.on{background:var(--accent-soft);color:var(--accent-text);font-weight:700}
  body.view-analytics .table-only{display:none !important}
  body.view-admin .filters, body.view-admin #kpis, body.view-admin #funnel, body.view-admin #addBtn{display:none !important}

  /* ---------- Admin pages ---------- */
  .adm{max-width:960px;width:100%;margin:18px auto 0;display:flex;flex-direction:column;gap:14px}
  .adm-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:16px;animation:in .3s var(--ease) both;text-align:start;width:100%}
  .adm-head{display:flex;align-items:flex-start;gap:12px}
  .adm-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);flex-shrink:0}
  .adm-tt{flex:1;min-width:0}
  .adm-tt h3{font-size:15px;font-weight:800;line-height:1.4}
  .adm-tt p{font-size:12.5px;color:var(--muted);margin-top:2px}
  .adm-head .chev{margin-top:10px;color:var(--muted);transition:transform .25s var(--ease)}
  .adm-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .adm-grid .full{grid-column:1 / -1}
  .f .hint{display:block;font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.5}
  .mono{font-family:'Inter',ui-monospace,monospace;direction:ltr;unicode-bidi:isolate}
  input.mono{text-align:start}
  input.mono::placeholder{font-family:'Tajawal','Inter',sans-serif;letter-spacing:0}
  [dir="ltr"] input.mono::placeholder{font-family:'Inter',sans-serif}
  [dir="rtl"] .ev-chip b{text-align:right}
  .ev-chip b,.ev-chip small{padding-inline-end:14px}
  [dir="rtl"] input.mono{text-align:right}
  .with-btn,.secret{display:flex;gap:6px}
  .with-btn input,.secret input{flex:1;min-width:0}
  .with-btn .icon-btn,.secret .icon-btn{width:40px;height:auto;border:1px solid var(--border);background:var(--surface-2)}
  .px-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
  .px-status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .px-status.on{background:color-mix(in srgb, var(--c-signed) 14%, transparent);color:var(--c-signed)}
  .px-status.on i{background:var(--c-signed);box-shadow:0 0 0 3px color-mix(in srgb, var(--c-signed) 25%, transparent)}
  .toggle-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer}
  .toggle-row .switch{margin:0;flex-shrink:0}
  .toggle-row b{display:block;font-size:13.5px}
  .toggle-row small{font-size:12px;color:var(--muted)}
  .opt{font-size:11px;font-weight:500;color:var(--faint);background:var(--surface-3);padding:1px 7px;border-radius:6px;margin-inline-start:4px;vertical-align:middle}
  details.fold summary{list-style:none;cursor:pointer}
  details.fold summary::-webkit-details-marker{display:none}
  details.fold[open] .adm-head .chev{transform:rotate(180deg)}
  .note{display:flex;gap:10px;padding:12px 14px;border-radius:11px;background:var(--warn-soft);color:var(--text);font-size:12.5px;line-height:1.6}
  .note svg{color:var(--warn);margin-top:2px}
  .note b{color:var(--warn)}
  .link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent-text)}
  .link:hover{text-decoration:underline}
  .ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
  .ev-chip{display:flex;flex-direction:column;gap:2px;padding:11px 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);position:relative}
  .ev-chip b{font-size:13px}
  .ev-chip small{font-size:12px;color:var(--muted)}
  .ev-dot{position:absolute;top:12px;inset-inline-end:12px;width:7px;height:7px;border-radius:50%;background:var(--c-signed)}
  .pill-count{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap}
  .url-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .url-row{display:flex;align-items:center;gap:12px;padding:10px 14px;transition:background .15s}
  .url-row + .url-row{border-top:1px solid var(--border)}
  .url-row:hover{background:var(--surface-2)}
  .url-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .url-main b{font-size:13px;font-weight:700}
  .url-main .url{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  [dir="rtl"] .url-main .url{text-align:right}
  .ev-badge{display:inline-flex;align-items:center;gap:4px;font-family:'Inter',monospace;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--surface-3);color:var(--muted);white-space:nowrap;direction:ltr}
  .ev-badge.key{background:color-mix(in srgb, var(--c-signed) 14%, transparent);color:var(--c-signed)}
  .ev-badge svg{width:12px;height:12px;fill:currentColor}
  .url-act{display:flex;gap:2px}
  .tip{display:flex;gap:10px;padding:13px 14px;border-radius:11px;background:var(--accent-soft);font-size:12.5px;line-height:1.7}
  .tip svg{color:var(--accent-text);margin-top:2px}
  .tip b{color:var(--accent-text)}
  .tip ul{margin:4px 0 0;padding-inline-start:18px}
  .adm-foot{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);z-index:3}
  .adm-foot-btns{display:flex;gap:8px}
  .adm-foot-btns button{padding:10px 18px;border-radius:10px;font-weight:700;display:flex;align-items:center;gap:6px}
  .adm-link{cursor:pointer;transition:border-color .2s,background .2s}
  .adm-link:hover{border-color:var(--accent);background:var(--accent-soft)}
  .act-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .act-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 14px;font-size:13px}
  .act-list .act-row + .act-row{border-top:1px solid var(--border)}
  .btn-line{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface-2);white-space:nowrap;cursor:pointer;transition:border-color .2s,background .2s}
  .btn-line:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
  .adm-card.danger{border-color:color-mix(in srgb, var(--danger) 35%, var(--border))}
  .adm-card.danger .adm-ico{background:var(--danger-soft);color:var(--danger)}
  .btn-danger{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:9px;background:var(--danger-soft);color:var(--danger);transition:background .2s,color .2s}
  .btn-danger:hover{background:var(--danger);color:#fff}
  .adm .f input:not([type=checkbox]),.adm .f textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:13.5px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
  .adm .f input:focus,.adm .f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .adm .f.err input{border-color:var(--danger)}
  @media (max-width:900px){.adm-grid{grid-template-columns:1fr}}

  /* ---------- Analytics ---------- */
  .an-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .an-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:14px;animation:in .35s var(--ease) both}
  .an-card.wide{grid-column:1 / -1}
  .an-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .an-head h3{font-size:14px;font-weight:800}
  .an-head span{font-size:12px;color:var(--muted)}
  .period{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 16px}
  .period b{color:var(--text)}
  .period .sep{color:var(--faint)}
  /* time chart */
  .tchart{direction:ltr;display:flex;align-items:flex-end;gap:3px;height:170px;padding-top:18px;border-bottom:1px solid var(--border-strong);position:relative}
  .tbar{flex:1;min-width:3px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
  .tbar span{width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;transition:height .5s var(--ease),opacity .2s;min-height:0}
  .tbar.zero span{background:var(--surface-3);height:2px !important;border-radius:2px}
  .tbar:hover span{opacity:.75}
  .tbar em{position:absolute;font-style:normal;font-size:11px;font-weight:700;color:var(--text);transform:translateY(-16px)}
  .tbar .tip{position:absolute;bottom:calc(100% + 6px);background:var(--text);color:var(--bg);font-size:11.5px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:2}
  .tbar:hover .tip{opacity:1}
  .taxis{direction:ltr;display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:-6px}
  /* funnel steps */
  .fsteps{display:flex;flex-direction:column;gap:10px}
  .fstep-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .fstep-top b{font-weight:800}
  .fstep-top > span:last-child{display:inline-flex;align-items:baseline;gap:6px}
  .fstep-top small{color:var(--muted);font-size:12px}
  .track{height:10px;border-radius:6px;background:var(--surface-3);overflow:hidden}
  .track span{display:block;height:100%;border-radius:6px;transition:width .6s var(--ease)}
  /* stat tiles */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:12px}
  .tile label{font-size:12px;color:var(--muted);display:block}
  .tile strong{font-size:22px;font-weight:800;display:block;margin-top:2px}
  .tile small{font-size:11.5px;color:var(--faint)}
  .tile.bad strong{color:var(--danger)}
  .tile.good strong{color:var(--c-signed)}
  /* breakdown rows */
  .rows{display:flex;flex-direction:column;gap:11px}
  .row-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .row-top span{color:var(--muted);font-size:12px}
  .an-empty{color:var(--faint);font-size:13px;text-align:center;padding:24px}

  .content{flex:1;overflow:auto;padding:0 24px 24px;display:flex;flex-direction:column;gap:16px}

  /* ---------- KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;display:flex;flex-direction:column;gap:3px;transition:background .3s}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}
  .kpi-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
  .kpi strong{font-size:27px;font-weight:800;line-height:1.2}
  .kpi small{font-size:12px;color:var(--muted)}
  .kpi small.warn{color:var(--danger);font-weight:500}
  .funnel-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px;display:flex;flex-direction:column;gap:10px}
  .funnel-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
  .funnel-head span{color:var(--muted);font-weight:500}
  .funnel{display:flex;height:6px;border-radius:6px;overflow:hidden;background:var(--surface-3);gap:2px}
  .funnel span{transition:flex-grow .5s var(--ease)}
  .funnel-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
  .funnel-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:5px}

  /* ---------- Table ---------- */
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;flex-shrink:0;max-height:calc(100vh - 190px);overscroll-behavior-x:contain;scroll-behavior:smooth}
  .table-wrap table{min-width:1080px}
  .table-wrap::-webkit-scrollbar{height:10px;width:8px}
  .table-wrap::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;border:2px solid var(--surface)}
  .table-wrap::-webkit-scrollbar-thumb:hover{background:var(--faint)}
  .table-wrap::-webkit-scrollbar-corner{background:transparent}
  th:first-child{border-start-start-radius:var(--radius)} th:last-child{border-start-end-radius:var(--radius)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:start;color:var(--muted);font-weight:500;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);position:sticky;top:0;z-index:5;white-space:nowrap;box-shadow:0 1px 0 var(--border)}
  td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  tbody tr{transition:background .15s}
  tbody tr:hover{background:var(--surface-2);cursor:pointer}
  .st-select{position:relative;display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:20px;background:color-mix(in srgb, var(--st) 14%, transparent);cursor:pointer;transition:background .2s}
  .st-select:hover{background:color-mix(in srgb, var(--st) 22%, transparent)}
  .st-select i{width:7px;height:7px;border-radius:50%;background:var(--st);flex-shrink:0}
  .st-select select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-size:12.5px;font-weight:500;color:var(--text);cursor:pointer;outline:none;padding-inline-end:2px}
  .st-select select option{background:var(--surface);color:var(--text)}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--surface-3);color:var(--muted)}
  .tag.dup{background:var(--warn-soft);color:var(--warn)}
  .tag.bad{background:var(--danger-soft);color:var(--danger)}
  .icon-btn{width:32px;height:30px;display:inline-grid;place-items:center;border-radius:8px;background:transparent;color:var(--muted);transition:background .2s,color .2s}
  .icon-btn:hover{color:var(--text);background:var(--hover)}
  .icon-btn.wa{color:var(--wa)}
  .icon-btn.danger:hover{color:var(--danger);background:var(--danger-soft)}
  .row-actions{display:flex;gap:2px}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--surface-3)}
  .pill i{width:7px;height:7px;border-radius:50%}
  .placeholder{flex:1;display:grid;place-items:center;color:var(--faint);border:1.5px dashed var(--border-strong);border-radius:var(--radius);min-height:300px;text-align:center;padding:20px}

  /* ---------- Drawer ---------- */
  .scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s var(--ease);z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:430px;max-width:94vw;background:var(--surface);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .3s var(--ease);z-index:50;display:flex;flex-direction:column}
  [dir="ltr"] .drawer{left:auto;right:0;border-right:0;border-left:1px solid var(--border);transform:translateX(100%)}
  .drawer.open,[dir="ltr"] .drawer.open{transform:none}
  .d-head{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--border)}
  .d-head h2{font-size:17px;font-weight:800;flex:1}
  .d-body{padding:20px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;flex:1}
  .sec-title{font-size:12px;color:var(--faint);font-weight:700;margin-bottom:8px}
  .field label{display:block;font-size:12px;color:var(--faint);margin-bottom:3px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .statuses{display:flex;flex-wrap:wrap;gap:6px}
  .st-btn{font-size:12.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--border-strong);color:var(--muted);transition:all .2s var(--ease);display:flex;align-items:center;gap:6px}
  .st-btn:hover{color:var(--text)}
  .st-btn i{width:7px;height:7px;border-radius:50%}
  .st-btn.on{color:var(--text);background:var(--surface-3);border-color:transparent;font-weight:700}
  .note-box{display:flex;flex-direction:column;gap:8px}
  textarea{width:100%;min-height:70px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text);font-size:13px;resize:vertical;outline:none;transition:border-color .2s}
  textarea:focus{border-color:var(--accent)}
  .note-wrap{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;transition:border-color .2s,box-shadow .2s}
  .note-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .note-wrap.rec{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
  .note-wrap textarea{border:0;background:transparent;box-shadow:none;min-height:76px;resize:none}
  .note-wrap textarea:focus{border:0}
  .note-bar{display:flex;align-items:center;gap:6px;padding:6px 8px 8px;border-top:1px solid var(--border)}
  .note-bar .btn-sm{margin-inline-start:auto;align-self:auto}
  .mic{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);transition:background .2s,color .2s,transform .15s}
  .mic:hover:not(:disabled){color:var(--text);background:var(--hover)}
  .mic:active{transform:scale(.94)}
  .mic:disabled,.mic-lang:disabled{opacity:.4;cursor:not-allowed}
  .rec .mic{background:var(--danger);color:#fff}
  .rec .mic::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--danger);animation:micring 1.4s var(--ease) infinite}
  @keyframes micring{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
  .mic-lang{font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--surface-3);color:var(--muted);transition:color .2s,background .2s}
  .mic-lang:hover:not(:disabled){color:var(--text);background:var(--hover)}
  .listening{display:none;align-items:center;gap:7px;font-size:12px;color:var(--danger);font-weight:500}
  .rec .listening{display:inline-flex}
  .eq{display:inline-flex;align-items:center;gap:2px;height:14px}
  .eq i{width:3px;border-radius:2px;background:var(--danger);animation:eq 0.9s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
  @keyframes eq{0%,100%{height:4px}50%{height:14px}}
  .mic-na{font-size:11.5px;color:var(--faint)}
  .btn-sm{align-self:flex-end;display:flex;align-items:center;gap:6px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:8px;transition:background .2s,opacity .2s}
  .btn-sm:disabled{opacity:.4;cursor:not-allowed}

  /* history timeline */
  .timeline{position:relative;display:flex;flex-direction:column;gap:14px;padding-inline-start:20px}
  .timeline::before{content:"";position:absolute;top:6px;bottom:6px;inset-inline-start:5px;width:1.5px;background:var(--border-strong)}
  .ev{position:relative;animation:in .3s var(--ease) both}
  .ev::before{content:"";position:absolute;inset-inline-start:-19px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--ev,var(--faint));box-shadow:0 0 0 3px var(--surface)}
  .ev-head{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;flex-wrap:wrap}
  .ev-time{font-size:11.5px;color:var(--faint)}
  .ev-note{margin-top:5px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:13px;color:var(--text);white-space:pre-wrap}
  .arrow{color:var(--faint)}

  [dir="rtl"] .field div.ltr{text-align:right}
  .info-card{display:flex;flex-direction:column;gap:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:16px}
  .copy-all{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:1px dashed var(--border-strong);background:var(--surface);transition:border-color .2s,background .2s,transform .15s var(--ease);text-align:start}
  .copy-all:hover{border-color:var(--accent);border-style:solid;background:var(--accent-soft)}
  .copy-all:active{transform:scale(.98)}
  .ca-ico{position:relative;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#7c5cff);color:#fff;flex-shrink:0;box-shadow:0 4px 12px color-mix(in srgb, var(--accent) 35%, transparent);transition:background .3s}
  .ca-ico svg{position:absolute;transition:opacity .25s var(--ease),transform .3s var(--ease)}
  .ca-ico svg:last-child{opacity:0;transform:scale(.4) rotate(-30deg)}
  .copy-all.done .ca-ico{background:var(--c-signed)}
  .copy-all.done .ca-ico svg:first-child{opacity:0;transform:scale(.4)}
  .copy-all.done .ca-ico svg:last-child{opacity:1;transform:none}
  .ca-txt{font-weight:700;font-size:13.5px}
  .ca-hint{margin-inline-start:auto;font-size:11.5px;color:var(--faint)}
  .d-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px}
  .btn-wa{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--wa);color:#fff;font-weight:700;border-radius:10px;padding:10px}
  .btn-ghost{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-3);border-radius:10px;padding:10px;font-weight:500}
  .btn-del{width:44px;display:grid;place-items:center;border-radius:10px;background:var(--danger-soft);color:var(--danger);transition:background .2s}
  .btn-del:hover{background:var(--danger);color:#fff}

  /* ---------- Modal ---------- */
  .modal{position:fixed;inset:0;display:grid;place-items:center;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
  .modal.open{opacity:1;pointer-events:auto}
  .modal-bg{position:absolute;inset:0;background:var(--scrim)}
  .modal-box{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;width:380px;max-width:92vw;box-shadow:var(--shadow);transform:scale(.96);transition:transform .2s var(--ease)}
  .modal.open .modal-box{transform:none}
  .modal-ico{width:42px;height:42px;border-radius:12px;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center;margin-bottom:12px}
  .modal-box h3{font-size:16px;font-weight:800;margin-bottom:6px}
  .modal-box p{font-size:13px;color:var(--muted);margin-bottom:18px}
  .modal-actions{display:flex;gap:8px}
  .modal-actions button{flex:1;padding:10px;border-radius:10px;font-weight:700}
  .btn-cancel{background:var(--surface-3)}
  .btn-confirm{background:var(--danger);color:#fff}

  /* ---------- Notifications ---------- */
  .notif-btn{position:relative;margin-bottom:4px;border:1px solid var(--border);background:var(--surface-2)}
  .notif-btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
  .bell{display:grid;place-items:center;transform-origin:50% 2px}
  .notif-btn.ring .bell{animation:ring 2.4s var(--ease) infinite}
  @keyframes ring{0%,60%,100%{transform:rotate(0)}64%{transform:rotate(14deg)}70%{transform:rotate(-12deg)}76%{transform:rotate(8deg)}82%{transform:rotate(-5deg)}88%{transform:rotate(2deg)}}
  .badge{margin-inline-start:auto;min-width:20px;height:20px;padding:0 6px;border-radius:20px;display:none;place-items:center;font-size:11px;font-weight:800;background:var(--surface-3);color:var(--muted)}
  .badge.show{display:grid}
  .badge.hot{background:var(--danger);color:#fff;box-shadow:0 0 0 3px var(--danger-soft)}

  .notif-pop{position:fixed;top:64px;inset-inline-start:262px;width:380px;max-height:calc(100vh - 90px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.28);z-index:45;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .2s var(--ease),transform .25s var(--ease)}
  .notif-pop.open{opacity:1;transform:none;pointer-events:auto}
  .np-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
  .np-head h3{font-size:15px;font-weight:800}
  .np-head .n{font-size:11.5px;color:var(--muted);background:var(--surface-3);padding:1px 8px;border-radius:20px}
  .np-head .icon-btn{margin-inline-start:auto}
  .np-body{overflow-y:auto;padding:8px}
  .np-sec{font-size:11px;font-weight:700;color:var(--faint);padding:10px 8px 6px;letter-spacing:.3px}
  .np-item{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;border:1px solid transparent;transition:background .2s,border-color .2s;animation:in .3s var(--ease) both}
  .np-item:hover{background:var(--surface-2);border-color:var(--border)}
  .np-item + .np-item{margin-top:2px}
  .np-row{display:flex;align-items:center;gap:10px}
  .np-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;color:var(--tc);background:color-mix(in srgb, var(--tc) 14%, transparent)}
  .np-main{flex:1;min-width:0}
  .np-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .np-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .np-meta i{width:4px;height:4px;border-radius:50%;background:var(--faint)}
  .chrono{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px;background:var(--surface-3)}
  .chrono .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .chrono .lbl .pulse{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .chrono .time{font-family:'Inter',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;letter-spacing:.5px;direction:ltr}
  .chrono .time{display:inline-flex;align-items:baseline;gap:8px}
  .chrono .dd{font-size:12px;font-weight:700;color:var(--muted);font-family:inherit}
  .chrono.soon{background:var(--warn-soft)}
  .chrono.soon .time{color:var(--warn)} .chrono.soon .pulse{background:var(--warn);animation:pulse 1.4s infinite}
  .chrono.late{background:var(--danger-soft)}
  .chrono.late .time{color:var(--danger)} .chrono.late .pulse{background:var(--danger);animation:pulse 1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb, currentColor 0%, transparent)}50%{opacity:.35}100%{opacity:1}}
  .np-actions{display:flex;gap:6px}
  .np-open{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:700;padding:7px;border-radius:9px;background:var(--accent-soft);color:var(--accent-text);transition:background .2s}
  .np-open:hover{background:color-mix(in srgb, var(--accent) 20%, transparent)}
  .np-actions .icon-btn{background:var(--surface-3)}
  .np-empty{padding:40px 20px;text-align:center;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px}
  .np-empty svg{width:34px;height:34px;opacity:.5}

  /* due chip in table + drawer card */
  .dt-cell{display:flex;align-items:center;gap:5px}
  .dt-time{font-size:12px;color:var(--faint);margin-top:1px}
  [dir="rtl"] .dt-time{text-align:right}
  .st-cell{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .due-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:6px;background:var(--surface-3);color:var(--muted)}
  .due-chip.soon{background:var(--warn-soft);color:var(--warn)}
  .due-chip.late{background:var(--danger-soft);color:var(--danger)}
  .due-card{display:flex;flex-direction:column;gap:10px;border:1px solid var(--border);border-radius:13px;padding:14px;background:var(--surface-2)}
  .due-top{display:flex;align-items:center;gap:10px}
  .due-top b{font-size:14px}
  .due-top small{display:block;font-size:12px;color:var(--muted)}
  .due-edit{margin-inline-start:auto;font-size:12.5px;font-weight:700;color:var(--accent-text);padding:5px 10px;border-radius:8px;transition:background .2s}
  .due-edit:hover{background:var(--accent-soft)}

  /* schedule modal */
  .sched-box{width:420px}
  .sched-box .modal-ico{background:color-mix(in srgb, var(--tc) 14%, transparent);color:var(--tc)}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .quick button{font-size:12.5px;padding:7px 11px;border-radius:9px;border:1px solid var(--border-strong);color:var(--muted);transition:all .2s var(--ease)}
  .quick button:hover{color:var(--text);border-color:var(--accent)}
  .quick button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .dt-input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;margin-bottom:10px;transition:border-color .2s}
  .dt-input:focus{border-color:var(--accent)}
  .sched-box textarea{min-height:60px;margin-bottom:16px}
  .btn-save{background:var(--accent) !important;color:#fff}
  .btn-save:disabled{opacity:.4;cursor:not-allowed}
  .ev-due{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:3px}

  /* ---------- New lead modal ---------- */
  .nl-box{width:620px;max-height:92vh;overflow-y:auto;padding:0}
  .nl-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
  .nl-head h3{margin:0 0 2px}
  .nl-head p{margin:0;font-size:12.5px}
  .nl-head .icon-btn{margin-inline-start:auto;background:transparent}
  .nl-ico{margin:0;background:var(--accent-soft);color:var(--accent-text)}
  .nl-form{display:grid;grid-template-columns:1fr 1fr;gap:14px 14px;padding:18px 22px 20px}
  .nl-form .full{grid-column:1 / -1}
  .f label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .f > label b{color:var(--danger)}
  .f .opt{font-weight:400;color:var(--faint)}
  .f input:not([type=checkbox]),.f select,.f textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:13.5px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
  .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .f input:disabled{opacity:.45}
  .f textarea{min-height:64px;resize:vertical}
  .f .ltr-in{direction:ltr;text-align:start}
  [dir="rtl"] .f .ltr-in{text-align:right}
  .f em{display:block;font-style:normal;font-size:11.5px;margin-top:4px;min-height:0}
  .f.err input,.f.err select{border-color:var(--danger)}
  .f.err em{color:var(--danger)}
  .f.warn em{color:var(--warn)}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .seg-opt{display:block !important;margin:0 !important;cursor:pointer}
  .seg-opt input{position:absolute;opacity:0;pointer-events:none}
  .seg-opt span{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);transition:all .2s var(--ease)}
  .seg-opt b{font-size:13.5px;color:var(--text)}
  .seg-opt small{font-size:11px;font-weight:700;color:var(--faint);background:var(--surface-3);padding:1px 7px;border-radius:6px}
  .seg-opt:hover span{border-color:var(--border-strong)}
  .seg-opt input:checked + span{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
  .seg-opt input:checked + span b{color:var(--accent-text)}
  .seg-opt input:checked + span small{background:var(--accent);color:#fff}
  .f.err .seg-opt span{border-color:var(--danger)}
  .chk{display:flex !important;align-items:center;gap:7px;margin:7px 0 0 !important;font-weight:500 !important;cursor:pointer;font-size:12.5px}
  .chk input{accent-color:var(--accent);width:15px;height:15px}
  .st-drop{position:relative;display:flex;align-items:center;background:color-mix(in srgb, var(--st) 12%, var(--surface-2));border:1px solid color-mix(in srgb, var(--st) 40%, var(--border));border-radius:10px;transition:background .2s,border-color .2s}
  .st-drop .dot{position:absolute;inset-inline-start:12px;width:8px;height:8px;border-radius:50%;background:var(--st);pointer-events:none}
  .st-drop select{appearance:none;-webkit-appearance:none;border:0 !important;background:transparent !important;box-shadow:none !important;padding-inline-start:28px !important;padding-inline-end:30px !important;font-weight:700;cursor:pointer}
  .st-drop svg{position:absolute;inset-inline-end:10px;pointer-events:none;color:var(--muted)}
  .due-f{display:none}
  .due-f.show{display:block;animation:in .25s var(--ease) both}
  .due-f .quick{margin-bottom:8px}
  .nl-foot{display:flex;gap:8px;padding-top:4px}
  .nl-foot button{flex:1;padding:11px;border-radius:10px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}

  /* Auth Gate Screen */
  .auth-gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .auth-box{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);padding:32px 28px;width:100%;max-width:380px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;gap:16px;animation:in .3s var(--ease) both}
  .auth-logo{width:56px;height:56px;border-radius:14px;object-fit:contain;margin:0 auto}
  .auth-box h2{font-size:18px;font-weight:800}
  .auth-box p{font-size:13px;color:var(--muted)}
  .auth-form{display:flex;flex-direction:column;gap:12px;margin-top:4px}
  .auth-input-wrap{display:flex;gap:6px}
  .auth-input-wrap input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;outline:none;text-align:center;letter-spacing:2px}
  .auth-input-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .auth-btn{background:var(--accent);color:#fff;border-radius:10px;padding:11px;font-weight:700;font-size:14px;transition:background .2s}
  .auth-btn:hover{background:var(--accent-hover)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:all .25s var(--ease);z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:1366px){td,th{padding-inline:9px}}
</style>

  if (s === 'pas de réponse' || s === 'pas de reponse' || s === 'noanswer' || s === 'لم يرد') return 'noanswer';
  if (s === 'à rappeler' || s === 'a rappeler' || s === 'rappeler' || s === 'callback' || s === 'إعادة الاتصال لاحقاً') return 'callback';

/* Audio chime notification */
function playNotificationSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch(e) {}
}

/* Normalization of phone for deduplication */
function normalizePhone(p) {
  if (!p) return '';
  let s = String(p).replace(/\D/g, '');
  if (s.startsWith('00213')) s = s.slice(5);
  else if (s.startsWith('213')) s = s.slice(3);
  s = s.replace(/^0+/, '');
  return s;
}

function isSamePhone(p1, p2) {
  const n1 = normalizePhone(p1);
  const n2 = normalizePhone(p2);
  if (!n1 || !n2) return false;
  if (n1 === n2) return true;
  if (n1.length >= 8 && n2.length >= 8) {
    return n1.slice(-8) === n2.slice(-8);
  }
  return false;
}

function deduplicateLeadsArray(arr) {
  if (!Array.isArray(arr)) return [];
  const map = new Map();
  arr.forEach(item => {
    if (!item) return;
    const key = normalizePhone(item.phone) || item.id || Math.random().toString();
    if (!map.has(key)) {
      map.set(key, { ...item });
    } else {
      const existing = map.get(key);
      if (item.status && statusToKey(item.status) !== 'new' && statusToKey(existing.status) === 'new') {
        existing.status = item.status;
      }
      if (item.notes && !existing.notes) existing.notes = item.notes;
      if (item.date && (!existing.date || new Date(item.date) > new Date(existing.date))) {
        existing.date = item.date;
      }
      if (item.dueAt && !existing.dueAt) existing.dueAt = item.dueAt;
      if (Array.isArray(item.history) && item.history.length > (existing.history || []).length) {
        existing.history = item.history;
      }
    }
  });
  return Array.from(map.values());
}

function loadLeads() {
  const saved = store.get(LEADS_KEY);
  if (saved) {
    try {
      leads = JSON.parse(saved);
      if (!Array.isArray(leads)) leads = [];
    } catch(e) {
      leads = [];
    }
  } else {
    leads = [];
  }
  leads = deduplicateLeadsArray(leads);
  if (leads.length === 0 && DEFAULT_LEADS.length > 0) {
    leads = deduplicateLeadsArray(DEFAULT_LEADS);
  }
  // Initialize additive fields (history & dueAt) backward-compatibly
  leads.forEach(l => {
    l.full_name = l.full_name || l.name || '';
    l.company_name = l.company_name || l.company || '';
    l.date = l.date || l.createdAt || new Date().toISOString();
    if (!Array.isArray(l.history) || l.history.length === 0) {
      l.history = [{
        type: 'created',
        at: new Date(l.date).getTime(),
        by: 'Landing page',
        manual: l.source === 'direct' || l.source === 'يدوي (Dashboard)'
      }];
      if (l.notes) {
        l.history.push({
          type: 'note',
          at: new Date(l.date).getTime() + 1000,
          text: l.notes,
          by: CURRENT_USER
        });
      }
    }
    if (l.dueAt === undefined) l.dueAt = null;
  });
  saveLeads();
}

const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtIso = s => s.split('-').reverse().join('/');

function presetRange(k){
  const today = new Date();
  const t0 = isoDay(today);
  if (k === 'all') return ['', ''];
  if (k === 'today') return [t0, t0];
  if (k === '7')  { const d = new Date(); d.setDate(d.getDate()-6); return [isoDay(d), t0]; }
  if (k === '30') { const d = new Date(); d.setDate(d.getDate()-29); return [isoDay(d), t0]; }
  if (k === 'month') { const d = new Date(today.getFullYear(), today.getMonth(), 1); return [isoDay(d), t0]; }
}

const PRESETS = [['all','pAll'],['today','pToday'],['7','p7'],['30','p30'],['month','pMonth']];

function renderPresets(){
  const container = $('#presets');
  if (!container) return;
  container.innerHTML = PRESETS.map(([k,lbl]) => {
    const [a,b] = presetRange(k);
    return `<button data-preset="${k}" class="${F.from===a && F.to===b ? 'on':''}">${t(lbl)}</button>`;
  }).join('');
  container.querySelectorAll('[data-preset]').forEach(b => {
    b.onclick = () => {
      const [a,c] = presetRange(b.dataset.preset);
      F.from = a; F.to = c;
      if ($('#fFrom')) $('#fFrom').value = a;
      if ($('#fTo')) $('#fTo').value = c;
      render();
    };
  });
}

function filtered(){
  const from = F.from ? new Date(F.from+'T00:00:00').getTime() : -Infinity;
  const to   = F.to   ? new Date(F.to+'T23:59:59').getTime()   :  Infinity;
  return leads.filter(l => {
    const name = l.full_name || l.name || '';
    const comp = l.company_name || l.company || '';
    const act = l.activity || '';
    const ph = l.phone || '';
    const notes = l.notes || '';
    const hay = (name + comp + ph + act + notes).toLowerCase();
    const stKey = statusToKey(l.status);
    const matchQ = !F.q || hay.includes(F.q);
    const matchSt = !F.status || stKey === F.status;
    const matchW = !F.wilaya || (l.wilaya && l.wilaya.toLowerCase().includes(F.wilaya.toLowerCase()));
    const created = leadCreatedAt(l);
    const matchDate = created >= from && created <= to;
    return matchQ && matchSt && matchW && matchDate;
  });
}

}

    { t: t('kProgress'), v: prog, s: t('kProgressS'), icon: 'phone', col: 'var(--c-meeting)' },

/* ================= ACTIONS & SCHEDULING ================= */
function requestStatus(id, stKey){
  const l = leads.find(x => String(x.id) === String(id));
  if (!l) return;
  if (SCHEDULED.includes(stKey)) {
    openSched(id, stKey);
  } else {
    setStatus(id, stKey);
  }
}

function setStatus(id, stKey, due, note){
  const l = leads.find(x => String(x.id) === String(id));
  if (!l) return;
  const now = Date.now();
  const oldKey = statusToKey(l.status);
  const storedVal = keyToStoredStatus(stKey);
  
  if (oldKey === stKey) {
    if (!due) return;
    l.history.push({ type: 'resched', at: now, due, by: CURRENT_USER });
  } else {
    l.history.push({ type: 'status', at: now, from: oldKey, to: stKey, due: due || undefined, by: CURRENT_USER });
    l.status = storedVal;
  }
  l.dueAt = SCHEDULED.includes(stKey) ? due : null;
  if (note && note.trim()) {
    l.history.push({ type: 'note', at: now + 1, text: note.trim(), by: CURRENT_USER });
    l.notes = (l.notes ? l.notes + ' | ' : '') + note.trim();
  }
  saveLeads();
  toast(due ? t('tScheduled', l.full_name || l.name, dueLabel(due)) : t('tMoved', l.full_name || l.name, stLabel(stKey)));
  syncLeadUpdate(l);
  render();
}

function askDelete(id){
  const l = leads.find(x => String(x.id) === String(id));
  if (!l) return;
  pendingDelete = l.id;
  $('#mTitle').textContent = t('delTitle');
  $('#mText').textContent = t('delText', l.full_name || l.name);
  $('#modal').classList.add('open');
}

/* Time & countdowns */
function historyHTML(l){
  const arr = Array.isArray(l.history) ? [...l.history] : [];
  return arr.sort((a,b) => b.at - a.at).map(ev => {
    let head, color = 'var(--faint)', body = '';
    if (ev.type === 'created') {
      head = ev.manual ? t('evCreatedManual') : t('evCreated');
      color = 'var(--c-new)';
    } else if (ev.type === 'status') {
      color = statusOf(ev.to).color;
      head = `${t('evStatus')}: <span style="color:var(--muted)">${stLabel(ev.from)}</span> <span class="arrow">${lang==='ar'?'←':'→'}</span> <b>${stLabel(ev.to)}</b>`;
      if (ev.due) body = `<div class="ev-due">${ico('clock')}<span class="ltr">${fmtDateTime(ev.due)}</span></div>`;
    } else if (ev.type === 'resched') {
      head = t('evResched');
      color = 'var(--c-callback)';
      body = `<div class="ev-due">${ico('clock')}<span class="ltr">${fmtDateTime(ev.due)}</span></div>`;
    } else {
      head = t('evNote');
      color = 'var(--accent)';
      body = `<div class="ev-note">${esc(ev.text)}</div>`;
    }
    return `<div class="ev" style="--ev:${color}">
      <div class="ev-head">${head}</div>
      <div class="ev-time"><span class="ltr">${fmtDateTime(ev.at)}</span> · ${t('by')} ${esc(ev.by || CURRENT_USER)}</div>
      ${body}
    </div>`;
  }).join('');
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, dictating = false, dictLang = store.get('crm-dict') || 'ar-DZ', dictBase = '';

function startDictation(){
  if (!SR) return toast(t('micNA'));
  const ta = $('#note'); if (!ta) return;
  rec = new SR(); rec.lang = dictLang; rec.continuous = true; rec.interimResults = true;
  dictBase = ta.value ? ta.value.replace(/\s*$/, ' ') : '';
  rec.onresult = e => {
    let finalTxt = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const tr = e.results[i][0].transcript;
      e.results[i].isFinal ? finalTxt += tr : interim += tr;
    }
    if (finalTxt) dictBase += finalTxt.trim() + ' ';
    ta.value = dictBase + interim;
    ta.scrollTop = ta.scrollHeight;
    $('#noteBtn').disabled = !ta.value.trim();
  };
  rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast(t('micDenied')); stopDictation(); };
  rec.onend = () => { if (dictating) { try { rec.start(); } catch(_) { stopDictation(); } } };
  try { rec.start(); } catch(_) { return; }
  dictating = true;
  $('#noteWrap').classList.add('rec'); $('#micBtn').title = t('micStop');
}

function stopDictation(){
  dictating = false;
  if (rec) { rec.onend = null; try { rec.stop(); } catch(_) {} rec = null; }
  const w = $('#noteWrap');
  if (w) {
    w.classList.remove('rec');
    if ($('#micBtn')) $('#micBtn').title = t('micStart');
    const ta = $('#note');
    if (ta) ta.value = ta.value.replace(/\s+$/, '');
  }
}

function addNote(id, text){
  const l = leads.find(x => String(x.id) === String(id));
  if (!l || !text.trim()) return;
  l.history = l.history || [];
  l.history.push({ type: 'note', at: Date.now(), text: text.trim(), by: CURRENT_USER });
  l.notes = (l.notes ? l.notes + ' | ' : '') + text.trim();
  saveLeads();
  syncLeadUpdate(l);
  toast(t('tNote'));
  openDrawer(id, false);
  renderAll();
}

function leadText(l){
  const notes = (l.history || []).filter(h => h.type === 'note');
  const last = notes[notes.length - 1];
  const name = l.full_name || l.name || 'Sans nom';
  const company = l.company_name || l.company || t('pending');
  const activity = l.activity || '';
  const wilaya = l.wilaya || 'Alger';
  const phone = l.phone || '';
  const source = srcLabel(l.source || 'web');
  const st = stLabel(statusToKey(l.status));
  const dateStr = fmtDateTime(leadCreatedAt(l));
  
  const lines = [
    `IDARATI CRM — ${t('leadSheet')}`,
    '━━━━━━━━━━━━━━',
    `${t('thName')}: ${name}`,
    `${t('thCompany')}: ${company}`,
    `${t('thActivity')}: ${activity}`,
    `${t('thWilaya')}: ${wilaya}`,
    `${t('thPhone')}: ${fmtPhone(phone)}`,
    `WhatsApp: ${waLink(phone)}`,
    `${t('source')}: ${source}`,
    `${t('status')}: ${st}`,
    `${t('received')}: ${dateStr}`
  ];
  if (last) lines.push(`${t('lastNote')} (${fmtDateTime(last.at)}): ${last.text}`);
  return lines.join('\n');
}

function copyText(txt){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt);
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  ta.remove();
  return Promise.resolve();
}

function copyLead(id, btn){
  const l = leads.find(x => String(x.id) === String(id));
  if (!l) return;
  copyText(leadText(l)).then(() => {
    toast(t('tCopiedLead'));
    if (btn) {
      btn.classList.add('done');
      const txtSpan = btn.querySelector('.ca-txt');
      if (txtSpan) txtSpan.textContent = t('copiedShort');
      setTimeout(() => {
        if (!btn.isConnected) return;
        btn.classList.remove('done');
        if (txtSpan) txtSpan.textContent = t('copyAll');
      }, 1800);
    }
  });
}

function closeDrawer(){
  stopDictation();
  openId = null;
  $('#drawer').classList.remove('open');
  $('#scrim').classList.remove('open');
}
$('#scrim').onclick = closeDrawer;
