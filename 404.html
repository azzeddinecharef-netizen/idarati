<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التوجيه... | IDARATI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #0b1638;
      color: #ffffff;
      font-family: 'Cairo', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .box {
      max-width: 480px;
      background: #11204d;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(245, 158, 11, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.4rem; margin-bottom: 10px; color: #f59e0b; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 10px;
      font-weight: 700;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
  <script>
    (function(){
      var rawPath = window.location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      var slugMap = {
        'services': '/services/',
        'service': '/services/',
        'nos-services': '/services/',
        'offer': '/offer/',
        'offre': '/offer/',
        'comptabilite': '/offer/',
        'how-it-works': '/how-it-works/',
        'steps': '/how-it-works/',
        'etapes': '/how-it-works/',
        'testimonials': '/testimonials/',
        'avis': '/testimonials/',
        'reviews': '/testimonials/',
        'about': '/about/',
        'a-propos': '/about/',
        'fondateur': '/about/',
        'annabi': '/about/',
        'faq': '/faq/',
        'questions': '/faq/',
        'order': '/order/',
        'form': '/order/',
        'demande': '/order/',
        'contact': '/contact/',
        'contactez-nous': '/contact/',
        'thank-you': '/thank-you/',
        'thankyou': '/thank-you/',
        'merci': '/merci/'
      };

      if (slugMap[rawPath]) {
        window.location.replace(slugMap[rawPath] + search + hash);
        return;
      }

      // Check if it's a known slug with missing slash
      var subdirs = ['services', 'offer', 'how-it-works', 'steps', 'testimonials', 'avis', 'about', 'faq', 'order', 'form', 'contact', 'thank-you', 'merci'];
      for (var i = 0; i < subdirs.length; i++) {
        if (rawPath.indexOf(subdirs[i]) !== -1) {
          window.location.replace('/' + subdirs[i] + '/' + search + hash);
          return;
        }
      }
    })();
  </script>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>جاري التوجيه إلى الصفحة...</h1>
    <p>إذا لم يتم تحويلك تلقائياً خلال ثانيتين، اضغط على الزر أدناه:</p>
    <a class="btn" href="/">العودة إلى الصفحة الرئيسية</a>
  </div>
</body>
</html>
